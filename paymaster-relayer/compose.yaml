# Multi-chain Paymaster Relayer ROFL configuration
# Each service monitors a different source chain and reports to the same CrossChainPaymaster

x-relayer-common: &relayer-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ghcr.io/oasisprotocol/rofl-paymaster-relayer:multichain
  platform: linux/amd64
  restart: on-failure
  volumes:
    - /run/rofl-appd.sock:/run/rofl-appd.sock

x-common-env: &common-env
  PYTHONUNBUFFERED: 1
  TARGET_RPC_URL: ${TARGET_RPC_URL}
  PAYMASTER_PROXY_ADDRESS: ${PAYMASTER_PROXY_ADDRESS}
  ROFL_ADAPTER_ADDRESS: ${ROFL_ADAPTER_ADDRESS}
  # Shared monitoring settings (per-chain POLLING_INTERVAL set in each service)
  RETRY_COUNT: ${RETRY_COUNT:-3}
  LOOKBACK_BLOCKS: ${LOOKBACK_BLOCKS:-9}
  PROCESS_BATCH_SIZE: ${PROCESS_BATCH_SIZE:-10}
  MAX_BLOCK_RANGE: ${MAX_BLOCK_RANGE:-10}

services:
  # Base Chain Relayer (Chain ID: 84532)
  # Block time: ~2s → polling: 6s
  relayer-base:
    <<: *relayer-common
    container_name: paymaster_relayer_base
    environment:
      <<: *common-env
      CHAIN_NAME: base
      SOURCE_RPC_URL: ${BASE_SOURCE_RPC_URL}
      PAYMASTER_VAULT_ADDRESS: ${BASE_VAULT_ADDRESS}
      POLLING_INTERVAL: ${BASE_POLLING_INTERVAL:-6}

  # Ethereum Relayer (Chain ID: 11155111)
  # Block time: ~12s → polling: 12s (default)
  relayer-eth:
    <<: *relayer-common
    container_name: paymaster_relayer_eth
    environment:
      <<: *common-env
      CHAIN_NAME: ethereum
      SOURCE_RPC_URL: ${ETH_SOURCE_RPC_URL}
      PAYMASTER_VAULT_ADDRESS: ${ETH_VAULT_ADDRESS}
      POLLING_INTERVAL: ${ETH_POLLING_INTERVAL:-12}

  # Arbitrum Relayer (Chain ID: 421614)
  # Block time: ~250ms → polling: 3s
  relayer-arb:
    <<: *relayer-common
    container_name: paymaster_relayer_arb
    environment:
      <<: *common-env
      CHAIN_NAME: arbitrum
      SOURCE_RPC_URL: ${ARB_SOURCE_RPC_URL}
      PAYMASTER_VAULT_ADDRESS: ${ARB_VAULT_ADDRESS}
      POLLING_INTERVAL: ${ARB_POLLING_INTERVAL:-3}
